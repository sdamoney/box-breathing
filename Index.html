<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Box breathing</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:system-ui, sans-serif; background:#fafaf7; color:#2c2c2a; }
  svg { width:min(90vw, 360px); height:auto; }
  .side { font-size:13px; fill:#6b6b66; }
  button { margin-top:16px; padding:10px 28px; font-size:16px; border:1px solid #b4b2a9; border-radius:8px; background:#fff; color:#2c2c2a; cursor:pointer; }
  @media (prefers-color-scheme: dark) {
    body { background:#1f1f1d; color:#eee; }
    .side { fill:#aaa; }
    #phase { fill:#eee; }
    #count { fill:#aaa; }
    #box { stroke:#555; }
    button { background:#2c2c2a; color:#eee; border-color:#555; }
  }
</style>
</head>
<body>
<svg viewBox="0 0 300 300">
  <rect id="box" x="50" y="50" width="200" height="200" fill="none" stroke="#ccc" stroke-width="2" rx="4"/>
  <line id="s0" x1="50" y1="250" x2="50" y2="50" stroke="#1D9E75" stroke-width="4" stroke-linecap="round" opacity="0"/>
  <line id="s1" x1="50" y1="50" x2="250" y2="50" stroke="#1D9E75" stroke-width="4" stroke-linecap="round" opacity="0"/>
  <line id="s2" x1="250" y1="50" x2="250" y2="250" stroke="#1D9E75" stroke-width="4" stroke-linecap="round" opacity="0"/>
  <line id="s3" x1="250" y1="250" x2="50" y2="250" stroke="#1D9E75" stroke-width="4" stroke-linecap="round" opacity="0"/>
  <text class="side" x="30" y="150" text-anchor="middle" transform="rotate(-90 30 150)">Breathe in</text>
  <text class="side" x="150" y="36" text-anchor="middle">Hold</text>
  <text class="side" x="270" y="150" text-anchor="middle" transform="rotate(90 270 150)">Breathe out</text>
  <text class="side" x="150" y="274" text-anchor="middle">Wait</text>
  <text id="phase" x="150" y="140" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#2c2c2a">Ready</text>
  <text id="count" x="150" y="180" text-anchor="middle" style="font-size:36px;font-weight:500;fill:#6b6b66">4</text>
  <circle id="dot" cx="50" cy="250" r="10" fill="#1D9E75"/>
</svg>
<button id="btn">Start</button>
<script>
  const pts=[[50,250],[50,50],[250,50],[250,250],[50,250]];
  const names=['Breathe in','Hold','Breathe out','Wait'];
  const D=4000; let running=false, start=0, elapsed=0, raf;
  const dot=document.getElementById('dot'), ph=document.getElementById('phase'),
        ct=document.getElementById('count'), btn=document.getElementById('btn');
  function draw(t){
    const cyc=t%(D*4), i=Math.floor(cyc/D), f=(cyc%D)/D, a=pts[i], b=pts[i+1];
    dot.setAttribute('cx', a[0]+(b[0]-a[0])*f);
    dot.setAttribute('cy', a[1]+(b[1]-a[1])*f);
    ph.textContent=names[i]; ct.textContent=4-Math.floor(f*4);
    for(let k=0;k<4;k++) document.getElementById('s'+k).setAttribute('opacity', k===i?1:0);
  }
  function loop(now){ elapsed=now-start; draw(elapsed); raf=requestAnimationFrame(loop); }
  btn.onclick=()=>{
    if(running){ cancelAnimationFrame(raf); running=false; btn.textContent='Resume'; }
    else { running=true; start=performance.now()-elapsed; raf=requestAnimationFrame(loop); btn.textContent='Pause'; }
  };
</script>
</body>
</html>
