<!DOCTYPE html>

<style>
  *{box-sizing:border-box}
  :root{--svg:min(80vw,320px);--box:calc(var(--svg) * 2 / 3)}
  html,body{margin:0;background:#101216}
  body{color:#d9d6cd;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px;-webkit-font-smoothing:antialiased}
  main{max-width:420px;margin:0 auto;min-height:calc(100vh - 48px);min-height:calc(100svh - 48px);display:flex;flex-direction:column;align-items:center;text-align:center}
  .screen{display:flex;flex-direction:column;align-items:center;animation:fadein 1.2s ease}
  .hidden{display:none}
  @keyframes fadein{from{opacity:0}to{opacity:1}}

  #intro,#outro{margin:auto 0;width:max-content;max-width:100%}
  .fit{width:0;min-width:100%}

  #session{padding-top:max(0px, calc(38vh - var(--svg) / 2 - 24px));padding-top:max(0px, calc(38svh - var(--svg) / 2 - 24px))}
  #session .quiet{width:var(--box)}

  h1{font-weight:400;font-size:22px;color:#e6e3da;margin:0 0 12px}
  h2{font-weight:400;font-size:20px;color:#e6e3da;margin:0 0 12px}
  .soft{color:#8f8c84;font-size:15px;line-height:1.7;margin:0 0 28px}
  .small{color:#5f5d58;font-size:13px;margin:14px 0 0}
  svg{width:var(--svg);height:auto;display:block}

  button{background:transparent;color:#cfccc3;border:1px solid #33363d;border-radius:999px;padding:10px 26px;font-size:15px;font-family:inherit;cursor:pointer;transition:border-color .4s,color .4s;-webkit-tap-highlight-color:transparent}
  button:hover,button:focus-visible{border-color:#5a5e66;color:#e6e3da;outline:none}
  .row{display:flex;gap:14px;margin-top:22px}
  .quiet{border:none;border-radius:8px;color:#6f6c66;font-size:13px;line-height:1.5;padding:12px 0;min-height:44px;margin-top:14px;text-wrap:balance}
  .quiet:hover,.quiet:focus-visible{color:#9a978f}
  .hint{font-size:12px;margin-top:4px;color:#5f5d58}
  .u{color:#a3a097;text-decoration:underline;text-decoration-color:#55585f;text-decoration-thickness:1px;text-underline-offset:4px}
  .quiet:hover .u,.quiet:focus-visible .u{color:#d9d6cd;text-decoration-color:#8f8c84}

  .progress{width:var(--box);height:2px;background:#1f2228;border-radius:2px;margin-top:16px;overflow:hidden}
  .bar{height:100%;width:0;background:#4f7a6e}
  .line{transition:opacity .8s ease}
  .fact{margin:4px 0 0;color:#7d7a73;font-size:clamp(12px, 3.8vw, 14px);line-height:1.7;height:5.1em;transition:opacity 1s ease;animation:fadein 1s ease}
  .fact span{display:block;white-space:nowrap}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (prefers-reduced-motion:reduce){.screen,.fact{animation:none}.fact,.line{transition:none}}
</style>
</head>
<body>
<main>

  <section id="intro" class="screen">
    <h1>Let's breathe together</h1>
    <p class="soft fit">Find a comfortable position.<br>Follow the circle and the dot.<br>You can stop anytime.</p>
    <button id="begin">Begin</button>
    <p class="small fit">About 2 minutes</p>
    <button class="quiet cues fit">Gentle cues: <span class="u">off</span></button>
  </section>

  <section id="session" class="screen hidden">
    <svg viewBox="0 0 300 300" aria-hidden="true">
      <rect x="50" y="50" width="200" height="200" rx="6" fill="none" stroke="#262930" stroke-width="1.5"/>
      <line id="s0" class="line" x1="50" y1="250" x2="50" y2="50" stroke="#5e9384" stroke-width="3" stroke-linecap="round" opacity="0"/>
      <line id="s1" class="line" x1="50" y1="50" x2="250" y2="50" stroke="#5e9384" stroke-width="3" stroke-linecap="round" opacity="0"/>
      <line id="s2" class="line" x1="250" y1="50" x2="250" y2="250" stroke="#5e9384" stroke-width="3" stroke-linecap="round" opacity="0"/>
      <line id="s3" class="line" x1="250" y1="250" x2="50" y2="250" stroke="#5e9384" stroke-width="3" stroke-linecap="round" opacity="0"/>
      <circle id="breath" cx="150" cy="150" r="32" fill="#5e9384" fill-opacity="0.10" stroke="#5e9384" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="30" y="150" text-anchor="middle" transform="rotate(-90 30 150)" fill="#55534e" font-size="12">Breathe in</text>
      <text x="150" y="36" text-anchor="middle" fill="#55534e" font-size="12">Hold</text>
      <text x="270" y="150" text-anchor="middle" transform="rotate(90 270 150)" fill="#55534e" font-size="12">Breathe out</text>
      <text x="150" y="272" text-anchor="middle" fill="#55534e" font-size="12">Rest</text>
      <g id="label">
        <text id="phase" x="150" y="140" text-anchor="middle" dominant-baseline="central" fill="#e6e3da" font-size="19">Breathe in</text>
        <text id="count" x="150" y="164" text-anchor="middle" dominant-baseline="central" fill="#6f6c66" font-size="15">4</text>
      </g>
      <circle id="dot" cx="50" cy="250" r="7" fill="#86b8a9"/>
    </svg>
    <div class="progress"><div id="bar" class="bar"></div></div>
    <div class="row">
      <button id="pause">Pause</button>
      <button id="end">End</button>
    </div>
    <button id="factToggle" class="quiet"></button>
    <p id="fact" class="fact hidden"></p>
    <button class="quiet cues">Gentle cues: <span class="u">off</span></button>
  </section>

  <section id="outro" class="screen hidden">
    <h2>Notice how you feel now</h2>
    <p class="soft fit">There's no right way to feel.<br>Stay here as long as you like.</p>
    <button id="again">Breathe again</button>
    <p class="small fit">About 2 minutes</p>
    <button class="quiet cues fit">Gentle cues: <span class="u">off</span></button>
    <button id="homeHint" class="quiet hint fit"></button>
  </section>

  <p id="live" class="sr" aria-live="polite"></p>

</main>

<script>
  const D=4000, ROUNDS=8, TOTAL=D*4*ROUNDS, R0=32, R1=88;
  const pts=[[50,250],[50,50],[250,50],[250,250],[50,250]];
  const names=['Breathe in','Hold','Breathe out','Rest'];
  const tones=[392,440,349,330];
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $=id=>document.getElementById(id);
  const dot=$('dot'), breath=$('breath'), phase=$('phase'), count=$('count'), bar=$('bar'), live=$('live'), label=$('label');
  const factEl=$('fact'), factToggle=$('factToggle'), cueBtns=document.querySelectorAll('.cues');
  let running=false, inSession=false, start=0, elapsed=0, raf=null, last=-1, cues=false, actx=null, wake=null;
  let factsOn=false;

  const ua=navigator.userAgent;
  const isIOS=/iPhone|iPad|iPod/i.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  const isAndroid=/Android/i.test(ua);
  const isMac=/Mac/i.test(navigator.platform) && !isIOS;
  const standalone=window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  let installEvt=null;
  window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; });

  const homeHint=$('homeHint');
  if(standalone){
    homeHint.remove();
  } else {
    homeHint.innerHTML = (isIOS||isAndroid)
      ? 'Keep it close: <span class="u">add to home screen</span>'
      : 'Keep it close: <span class="u">bookmark this page</span>';
    homeHint.onclick=async()=>{
      if(installEvt){
        installEvt.prompt();
        try{ await installEvt.userChoice; }catch(e){}
        installEvt=null;
        return;
      }
      homeHint.textContent = isIOS ? 'Tap the Share icon, then "Add to Home Screen"'
        : isAndroid ? 'Open the browser menu (⋮), then "Add to home screen"'
        : isMac ? 'Press ⌘ + D to bookmark this page'
        : 'Press Ctrl + D to bookmark this page';
    };
  }

  const ease=f=>0.5-0.5*Math.cos(Math.PI*f);

  function show(id){ ['intro','session','outro'].forEach(s=>$(s).classList.toggle('hidden', s!==id)); }

  function applyFacts(){
    factEl.classList.toggle('hidden', !factsOn);
    factToggle.innerHTML = factsOn
      ? 'Back to <span class="u">just breathing</span>'
      : 'Mind wandering? <span class="u">Read something</span> as you breathe';
  }

  function cue(i){
    if(!cues) return;
    if(navigator.vibrate) navigator.vibrate(20);
    if(!actx) return;
    const t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
    o.type='sine'; o.frequency.value=tones[i];
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.04,t+0.08);
    g.gain.exponentialRampToValueAtTime(0.0001,t+1.4);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t+1.5);
  }

  function draw(t){
    const cyc=t%(D*4), i=Math.min(3,Math.floor(cyc/D)), f=(cyc-i*D)/D;
    const a=pts[i], b=pts[i+1];
    if(!reduce){
      dot.setAttribute('cx', a[0]+(b[0]-a[0])*f);
      dot.setAttribute('cy', a[1]+(b[1]-a[1])*f);
    }
    const level = i===0 ? ease(f) : i===1 ? 1 : i===2 ? 1-ease(f) : 0;
    if(reduce){
      breath.setAttribute('r',60);
      breath.setAttribute('fill-opacity',(0.05+0.15*level).toFixed(3));
    } else {
      breath.setAttribute('r',(R0+(R1-R0)*level).toFixed(2));
      const s=0.6+0.4*level;
      label.setAttribute('transform','translate(150 150) scale('+s.toFixed(3)+') translate(-150 -150)');
    }
    if(i!==last){
      last=i;
      phase.textContent=names[i];
      phase.setAttribute('y',140);
      live.textContent=names[i];
      for(let k=0;k<4;k++) $('s'+k).setAttribute('opacity', k===i?0.9:0);
      cue(i);
    }
    count.textContent=4-Math.floor(f*4);
  }

  function loop(now){
    elapsed=Math.max(0, now-start);
    if(elapsed>=TOTAL){ finish(); return; }
    draw(elapsed);
    bar.style.width=(elapsed/TOTAL*100).toFixed(2)+'%';
    raf=requestAnimationFrame(loop);
  }

  async function keepAwake(){ try{ if('wakeLock' in navigator) wake=await navigator.wakeLock.request('screen'); }catch(e){} }
  function letSleep(){ try{ if(wake){ wake.release(); wake=null; } }catch(e){} }

  function run(){
    running=true;
    start=performance.now()-elapsed;
    last=-1;
    $('pause').textContent='Pause';
    keepAwake();
    raf=requestAnimationFrame(loop);
  }

  function pause(){
    if(!running) return;
    running=false;
    cancelAnimationFrame(raf);
    letSleep();
    phase.textContent='Paused';
    phase.setAttribute('y',150);
    count.textContent='';
    live.textContent='Paused';
    $('pause').textContent='Resume';
  }

  function begin(){
    elapsed=0; inSession=true;
    bar.style.width='0%';
    applyFacts();
    show('session');
    window.scrollTo(0,0);
    run();
  }

  function finish(){
    running=false; inSession=false;
    cancelAnimationFrame(raf);
    letSleep();
    show('outro');
    window.scrollTo(0,0);
    live.textContent='Session complete. Notice how you feel now.';
  }

  $('begin').onclick=begin;
  $('again').onclick=begin;
  $('end').onclick=finish;
  $('pause').onclick=()=>{ running ? pause() : run(); };
  factToggle.onclick=()=>{ factsOn=!factsOn; applyFacts(); };
  cueBtns.forEach(btn=>btn.onclick=()=>{
    cues=!cues;
    cueBtns.forEach(b=>b.innerHTML='Gentle cues: <span class="u">'+(cues?'on':'off')+'</span>');
    if(cues){
      if(!actx){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) actx=new AC(); }
      if(actx && actx.state==='suspended') actx.resume();
    }
  });
  document.addEventListener('visibilitychange',()=>{ if(document.hidden && inSession) pause(); });

  const facts=[
    ["Slow breathing calms you.", "Your heart rate slows down.", "Tense muscles loosen up."],
    ["Your heart slows on exhale.", "Long exhales calm you most.", "Let each exhale be slow."],
    ["Anxiety speeds up breathing.", "Slowing down signals safety.", "Your body begins to settle."],
    ["Breathing is automatic.", "You can also control it.", "It is always there for you."],
    ["This is 4 breaths a minute.", "Most people take 12 to 20.", "Slower breathing is calmer."],
    ["The mind follows the breath.", "Slow breaths quiet the mind.", "Racing thoughts slow down."],
    ["Stanford studied breathwork.", "Five minutes a day helped.", "Mood improved in a month."],
    ["Soldiers use box breathing.", "It helps them stay steady.", "Anyone can learn it too."],
    ["A busy mind needs a task.", "Counting gives it one.", "Four counts is enough."],
    ["Worry lives in the future.", "Your breath is in the now.", "Follow it back to now."],
    ["Calm breaths start low.", "Let your belly rise first.", "Keep your shoulders soft."],
    ["Your nose filters the air.", "It warms the air as well.", "Try breathing through it."],
    ["You can do this anywhere.", "No one else will notice.", "It works at home or work."],
    ["Calm breathing is a skill.", "Practice makes it easier.", "Every round you do counts."],
    ["Lightheaded? Take a break.", "Breathe normally for a bit.", "Then join back in gently."],
    ["Slow breathing shifts gears.", "Your body moves toward rest.", "Stress responses ease off."]
  ];
  for(let i=facts.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [facts[i],facts[j]]=[facts[j],facts[i]]; }
  const renderFact=f=>{ factEl.innerHTML=f.map(l=>'<span>'+l+'</span>').join(''); };
  let fi=0;
  renderFact(facts[0]);
  setInterval(()=>{
    fi=(fi+1)%facts.length;
    if(reduce){ renderFact(facts[fi]); return; }
    factEl.style.opacity=0;
    setTimeout(()=>{ renderFact(facts[fi]); factEl.style.opacity=1; },1000);
  },9000);
</script>
</body>
</html>
